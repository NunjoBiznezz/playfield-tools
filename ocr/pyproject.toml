[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "schematic-ocr"
dynamic = ["version"]
description = "Make scanned schematic PDFs searchable, including sideways and upside-down labels"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Doug Bercot" }]
keywords = ["ocr", "pdf", "schematic", "tesseract", "pinball"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: Multimedia :: Graphics :: Capture :: Scanners",
]
# Keep in step with requirements.txt
dependencies = [
    "pillow>=9.1",
    "pytesseract>=0.3.10",
    "reportlab>=3.6",
    "pypdf>=3.0",
    "pikepdf>=6.0",
]

[project.urls]
Homepage = "https://github.com/NunjoBiznezz/playfield-tools/tree/main/ocr"

[project.scripts]
schematic-ocr = "schematic_ocr.cli:main"

[tool.setuptools.dynamic]
version = { attr = "schematic_ocr.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
