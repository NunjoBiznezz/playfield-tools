# Builds the schematic-ocr package (ocr/) and attaches it to a GitHub Release.
# Runs when a tag like ocr-v1.0.0 is pushed:  git tag ocr-v1.0.0 && git push origin ocr-v1.0.0
name: Release schematic-ocr

on:
  push:
    tags: ["ocr-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the OCR tools
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr poppler-utils

      - name: Check the tag matches the package version
        run: |
          want="${GITHUB_REF_NAME#ocr-v}"
          have=$(python -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('ocr/src/schematic_ocr/__init__.py').read()).group(1))")
          if [ "$want" != "$have" ]; then
            echo "Tag says $want but __init__.py says $have"; exit 1
          fi

      - name: Build wheel and source archive
        run: |
          python -m pip install --upgrade pip build
          python -m build ocr

      - name: Smoke test the wheel
        run: |
          python -m pip install ocr/dist/*.whl
          schematic-ocr --version
          python - <<'PY'
          from reportlab.pdfgen import canvas
          c = canvas.Canvas("test.pdf", pagesize=(400, 200))
          c.setFont("Helvetica-Bold", 28)
          c.drawString(30, 120, "COIL A-1")
          c.saveState(); c.translate(330, 20); c.rotate(90)
          c.drawString(0, 0, "SWITCH 12"); c.restoreState()
          c.save()
          PY
          # make it a scan (image only) so there is no text to start with
          pdftoppm -png -r 200 test.pdf scan
          python -c "from PIL import Image; Image.open('scan-1.png').convert('RGB').save('scan.pdf', resolution=200)"
          schematic-ocr scan.pdf scan_ocr.pdf --dpi 200
          python - <<'PY'
          from pypdf import PdfReader
          text = PdfReader("scan_ocr.pdf").pages[0].extract_text()
          print(repr(text))
          assert "COIL" in text and "SWITCH" in text, "OCR text missing"
          PY

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: schematic-ocr ${{ github.ref_name }}
          body: |
            Install: see [ocr/README.md](https://github.com/NunjoBiznezz/playfield-tools/tree/main/ocr#install).
            Download the `.whl` below and run `pipx install ./<file>.whl` (needs tesseract and poppler).
          files: ocr/dist/*
